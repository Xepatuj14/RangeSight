name: TestFlight Upload

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: RangeSight.xcodeproj
  SCHEME: RangeSight
  BUNDLE_ID: com.rangesight.app
  MARKETING_VERSION: 0.1.0

jobs:
  testflight:
    name: Archive and Upload Internal TestFlight Build
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Resolve Xcode project dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME"

      - name: Build app for iOS Simulator
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run supplementary Swift package tests
        run: swift test

      - name: Install Apple distribution certificate
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/rangesight-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/rangesight-signing.keychain-db"

          decode_base64() {
            if base64 --help 2>&1 | grep -q -- '--decode'; then
              base64 --decode
            else
              base64 -D
            fi
          }

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE" | decode_base64 > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profile
        shell: bash
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail

          PROFILE_PATH="$RUNNER_TEMP/rangesight.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/rangesight-profile.plist"
          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          decode_base64() {
            if base64 --help 2>&1 | grep -q -- '--decode'; then
              base64 --decode
            else
              base64 -D
            fi
          }

          printf '%s' "$IOS_PROVISIONING_PROFILE" | decode_base64 > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          EXPECTED_APP_IDENTIFIER="$TEAM_ID.$BUNDLE_ID"

          if [[ "$APP_IDENTIFIER" != "$EXPECTED_APP_IDENTIFIER" ]]; then
            echo "Provisioning profile application identifier '$APP_IDENTIFIER' does not match '$EXPECTED_APP_IDENTIFIER'." >&2
            exit 1
          fi

          mkdir -p "$PROFILE_INSTALL_DIR"
          PROFILE_INSTALL_PATH="$PROFILE_INSTALL_DIR/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE_PATH" "$PROFILE_INSTALL_PATH"

          echo "Derived Team ID: $TEAM_ID"
          echo "Provisioning profile name: $PROFILE_NAME"
          echo "Provisioning profile UUID: $PROFILE_UUID"

          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_PLIST=$PROFILE_PLIST" >> "$GITHUB_ENV"
          echo "PROFILE_INSTALL_PATH=$PROFILE_INSTALL_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          ASC_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$ASC_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          mkdir -p "$ASC_KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$ASC_KEY_PATH"
          if grep -q '\\n' "$ASC_KEY_PATH"; then
            perl -0pi -e 's/\\n/\n/g' "$ASC_KEY_PATH"
          fi
          chmod 600 "$ASC_KEY_PATH"

          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive Release build
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/RangeSight.xcarchive"
          echo "Archive path: $ARCHIVE_PATH"
          echo "App bundle ID: $BUNDLE_ID"
          echo "Marketing version: $MARKETING_VERSION"
          echo "CI build number: $GITHUB_RUN_NUMBER"

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Verify archive
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$ARCHIVE_PATH/Products/Applications/RangeSight.app"
          INFO_PLIST="$APP_PATH/Info.plist"
          EMBEDDED_PROFILE="$APP_PATH/embedded.mobileprovision"
          ARCHIVE_PROFILE_PLIST="$RUNNER_TEMP/archive-embedded-profile.plist"

          test -d "$ARCHIVE_PATH"
          test -d "$APP_PATH"
          test -f "$INFO_PLIST"
          test -f "$EMBEDDED_PROFILE"

          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")

          if [[ "$ACTUAL_BUNDLE_ID" != "$BUNDLE_ID" ]]; then
            echo "Archived bundle ID '$ACTUAL_BUNDLE_ID' does not match '$BUNDLE_ID'." >&2
            exit 1
          fi

          if [[ "$ACTUAL_VERSION" != "$MARKETING_VERSION" ]]; then
            echo "Archived version '$ACTUAL_VERSION' does not match '$MARKETING_VERSION'." >&2
            exit 1
          fi

          if [[ "$ACTUAL_BUILD" != "$GITHUB_RUN_NUMBER" ]]; then
            echo "Archived build '$ACTUAL_BUILD' does not match '$GITHUB_RUN_NUMBER'." >&2
            exit 1
          fi

          security cms -D -i "$EMBEDDED_PROFILE" > "$ARCHIVE_PROFILE_PLIST"
          ARCHIVE_APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$ARCHIVE_PROFILE_PLIST")
          EXPECTED_APP_IDENTIFIER="$TEAM_ID.$BUNDLE_ID"

          if [[ "$ARCHIVE_APP_IDENTIFIER" != "$EXPECTED_APP_IDENTIFIER" ]]; then
            echo "Embedded profile application identifier '$ARCHIVE_APP_IDENTIFIER' does not match '$EXPECTED_APP_IDENTIFIER'." >&2
            exit 1
          fi

          codesign -dv "$APP_PATH" 2>&1 | sed -n '/Authority=/p;/TeamIdentifier=/p'
          echo "Verified app bundle ID: $ACTUAL_BUNDLE_ID"
          echo "Verified app version: $ACTUAL_VERSION"
          echo "Verified app build: $ACTUAL_BUILD"

          echo "ARCHIVE_PROFILE_PLIST=$ARCHIVE_PROFILE_PLIST" >> "$GITHUB_ENV"

      - name: Create ExportOptions.plist
        shell: bash
        run: |
          set -euo pipefail

          EXPORT_OPTIONS_PLIST="$RUNNER_TEMP/ExportOptions.plist"

          cat > "$EXPORT_OPTIONS_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "$EXPORT_OPTIONS_PLIST"
          echo "EXPORT_OPTIONS_PLIST=$EXPORT_OPTIONS_PLIST" >> "$GITHUB_ENV"

      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail

          EXPORT_PATH="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_PATH"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

          IPA_COUNT=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')
          if [[ "$IPA_COUNT" != "1" ]]; then
            echo "Expected exactly one IPA in '$EXPORT_PATH', found $IPA_COUNT." >&2
            find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print
            exit 1
          fi

          IPA_PATH=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)
          echo "IPA path: $IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Verify App Store Connect upload tool
        shell: bash
        run: |
          set -euo pipefail

          if ! xcrun altool --help 2>&1 | grep -q -- '--upload-app'; then
            echo "xcrun altool upload support was not found in the installed Xcode." >&2
            exit 1
          fi

      - name: Upload IPA to App Store Connect
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        if: always() && env.IPA_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: rangesight-testflight-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

          rm -f "${CERTIFICATE_PATH:-}"
          rm -f "${PROFILE_PATH:-}"
          rm -f "${PROFILE_PLIST:-}"
          rm -f "${PROFILE_INSTALL_PATH:-}"
          rm -f "${ASC_KEY_PATH:-}"
          rm -f "${EXPORT_OPTIONS_PLIST:-}"
          rm -f "${ARCHIVE_PROFILE_PLIST:-}"
